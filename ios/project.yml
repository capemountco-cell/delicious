name: Delicious
options:
  bundleIdPrefix: com.capemount
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DeliciousCore:
    path: Packages/DeliciousCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Address of the tidy endpoint in the Lovable project. Empty = feature quietly off.
    TIDY_ENDPOINT: ""

targets:
  Delicious:
    type: application
    platform: iOS
    sources:
      - path: Delicious
    dependencies:
      - package: DeliciousCore
    settings:
      base:
        PRODUCT_NAME: Delicious
        PRODUCT_BUNDLE_IDENTIFIER: com.capemount.delicious
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Delicious/Info.plist
      properties:
        CFBundleDisplayName: delicious
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.capemount.delicious
            CFBundleURLSchemes:
              - delicious
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsArbitraryLoadsForMedia: true
        DLTidyEndpoint: $(TIDY_ENDPOINT)
